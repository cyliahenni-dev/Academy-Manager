<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الأكاديمية التعليمية</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.28)), 
                        url('https://flagcdn.com/w1280/dz.png') center/cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 70px;
            padding-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.28)), 
                        url('https://flagcdn.com/w1280/dz.png') center/cover no-repeat fixed;
            animation: waveFlag 18s linear infinite;
            z-index: -1;
            opacity: 0.9;
        }

        @keyframes waveFlag {
            0%   { background-position: 0% 50%; }
            25%  { background-position: 30% 45%; }
            50%  { background-position: 100% 55%; }
            75%  { background-position: 70% 48%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 38px;
            margin-bottom: 45px;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.7);
            z-index: 2;
            color: #ffffff;
            font-weight: 700;
        }

        .menu-container {
            display: flex;
            align-items: center;
            gap: 80px;
            width: 100%;
            max-width: 1350px;
            justify-content: center;
            z-index: 2;
            padding: 0 40px;
        }

        .menu-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 300px;
        }

        .center-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-width: 320px;
            margin-top: 25px;
        }

        .column-title {
            text-align: center;
            margin-bottom: 18px;
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        /* اليسار - الإدارة الرئيسية (أخضر) */
        .main-column .column-title {
            color: #27ae60;
        }

        .main-column button {
            background: rgba(39, 174, 96, 0.95);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .main-column button:hover {
            background: rgba(39, 150, 80, 0.98);
            transform: translateY(-6px);
        }

        /* اليمين - العمليات والتقارير (أحمر) */
        .operations-column .column-title {
            color: #e74c3c;
        }

        .operations-column button {
            background: rgba(231, 76, 60, 0.95);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .operations-column button:hover {
            background: rgba(192, 57, 43, 0.98);
            transform: translateY(-6px);
        }

        .report-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            font-size: 18px;
            font-weight: 700;
            padding: 28px 40px;
            min-height: 85px;
            border: 4px solid #c0392b;
            box-shadow: 0 10px 30px rgba(192, 57, 43, 0.5);
        }

        .report-btn:hover {
            background: white;
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 35px rgba(192, 57, 43, 0.6);
        }

        button {
            padding: 24px 32px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            min-height: 68px;
        }

        .status {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255,255,255,0.95);
            color: #27ae60;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="status">✅ الخادم يعمل بنجاح</div>

    <h1>🎓 نظام إدارة الأكاديمية التعليمية</h1>

    <div class="menu-container">
        
        <!-- اليسار - الإدارة الرئيسية -->
        <div class="menu-column main-column">
            <div class="column-title">الإدارة الرئيسية</div>
            <button onclick="window.location.href='students.html'">👨‍🎓 إدارة الطلاب</button>
            <button onclick="window.location.href='teachers.html'">👨‍🏫 إدارة المعلمين</button>
            <button onclick="window.location.href='attendance.html'">📅 تسجيل الحضور (RFID)</button>
        </div>

        <!-- الوسط - التقارير المالية -->
        <div class="center-button">
            <button onclick="window.location.href='reports.html'" class="report-btn">
                📊 التقارير المالية
            </button>
        </div>

        <!-- اليمين - العمليات والتقارير -->
        <div class="menu-column operations-column">
            <div class="column-title">العمليات والتقارير</div>
            <button onclick="window.location.href='payments.html'">💰 مدفوعات الطلاب</button>
            <button onclick="window.location.href='contracts.html'">📋 عقود المعلمين</button>
            <button onclick="window.location.href='expenses.html'">💸 المصروفات الأخرى</button>
        </div>

    </div>
</body>
</html>
